services:
  - type: web
    name: alphapilot-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SCHEDULER_SECRET
        sync: false
      - key: API_ACCESS_TOKEN
        sync: false
      - key: TOSS_INVEST_CLIENT_ID
        sync: false
      - key: TOSS_INVEST_CLIENT_SECRET
        sync: false
      - key: TOSS_INVEST_ACCOUNT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.11
